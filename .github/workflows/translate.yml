name: Daily Manga Translation

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 Pillow opencv-python-headless numpy
        pip install googletrans==3.1.0a0  # Use older sync version
        
    - name: Create working manga translator
      run: |
        cat > manga_bot.py << 'EOF'
        #!/usr/bin/env python3
        """
        Working Manga Translator for Blogger
        """
        import os
        import requests
        import json
        import logging
        from googletrans import Translator
        
        logging.basicConfig(level=logging.INFO, format='%(asctime)s - %(levelname)s - %(message)s')
        logger = logging.getLogger(__name__)
        
        def translate_manga_content():
            """Translate manga content and post to Blogger"""
            
            # Get credentials
            blog_id = os.getenv('BLOGGER_BLOG_ID')
            api_key = os.getenv('BLOGGER_API_KEY')
            
            if not blog_id or not api_key:
                logger.error("Missing Blogger credentials")
                return False
            
            try:
                # Test translation
                translator = Translator()
                
                # Sample manga content to translate
                japanese_texts = [
                    "こんにちは、読者の皆さん",
                    "今日は新しい章を始めます",
                    "主人公の冒険が続きます",
                    "次回に続く"
                ]
                
                translated_texts = []
                for text in japanese_texts:
                    translated = translator.translate(text, src='ja', dest='mr')
                    translated_texts.append(f"{text} → {translated.text}")
                    logger.info(f"Translated: {text} → {translated.text}")
                
                # Create Blogger post
                post_content = f"""
                <h2>🎌 मराठी मांगा अनुवाद - परीक्षण पोस्ट</h2>
                <p><strong>📅 प्रकाशित: {os.popen('date').read().strip()}</strong></p>
                
                <div style="background: #f5f5f5; padding: 20px; border-radius: 10px; margin: 20px 0;">
                <h3>🧪 अनुवाद परीक्षण परिणाम:</h3>
                <ul>
                """
                
                for result in translated_texts:
                    post_content += f"<li>{result}</li>"
                
                post_content += """
                </ul>
                <p>✅ मांगा अनुवाद प्रणाली कार्यरत आहे!</p>
                </div>
                
                <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 25px; border-radius: 15px; text-align: center;">
                <h3>📖 पुढील मांगा अनुवाद</h3>
                <p>ही प्रणाली आपोआप जपानी/कोरियन मांगा मराठीत भाषांतरित करेल आणि ब्लॉगरवर पोस्ट करेल.</p>
                <p>🚀 दररोज नवीन अध्याय उपलब्ध!</p>
                </div>
                
                <p><em>🌟 ही एक स्वयंचलित पोस्ट आहे. प्रणाली यशस्वीरित्या कार्यरत आहे!</em></p>
                """
                
                # Create post data
                post_data = {
                    'title': 'मराठी मांगा अनुवाद प्रणाली - परीक्षण सफल!',
                    'content': post_content,
                    'labels': ['मांगा', 'मराठी', 'अनुवाद', 'जपानी', 'कोरियन']
                }
                
                # Post to Blogger
                url = f'https://www.googleapis.com/blogger/v3/blogs/{blog_id}/posts'
                params = {'key': api_key}
                
                response = requests.post(url, json=post_data, params=params)
                
                if response.status_code == 200:
                    post_id = response.json()['id']
                    post_url = f"https://www.blogger.com/blog/post/edit/{blog_id}/{post_id}"
                    
                    logger.info("✅ मांगा अनुवाद पोस्ट यशस्वी!")
                    logger.info(f"📝 पोस्ट आयडी: {post_id}")
                    logger.info(f"🔗 पोस्ट URL: {post_url}")
                    
                    return True
                else:
                    logger.error(f"❌ ब्लॉगर पोस्ट त्रुटी: {response.status_code}")
                    logger.error(response.text)
                    return False
                    
            except Exception as e:
                logger.error(f"❌ त्रुटी: {e}")
                return False
        
        def main():
            logger.info("🚀 मराठी मांगा अनुवाद प्रणाली सुरू करीत आहे...")
            
            if translate_manga_content():
                logger.info("🎉 प्रणाली यशस्वीरित्या कार्यरत आहे!")
                logger.info("📖 पुढील चरण: वास्तविक मांगा प्रतिमा प्रक्रिया जोडणे")
            else:
                logger.error("❌ प्रणाली त्रुटी")
        
        if __name__ == "__main__":
            main()
        EOF
        
    - name: Run manga translator
      env:
        BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        BLOGGER_API_KEY: ${{ secrets.BLOGGER_API_KEY }}
      run: |
        python manga_bot.py
