name: Daily Manga Translation

on:
  schedule:
    - cron: '0 8 * * *'  # Daily at 8 AM UTC
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 Pillow easyocr googletrans numpy opencv-python-headless lxml
        
    - name: Create fixed manga translator
      run: |
        cat > fixed_translator.py << 'EOF'
        #!/usr/bin/env python3
        """
        Fixed Manga Translator for GitHub Actions
        """
        import os
        import logging
        
        logging.basicConfig(level=logging.INFO)
        logger = logging.getLogger(__name__)
        
        def main():
            logger.info("🚀 Starting Manga Translator")
            
            # Test Blogger credentials
            blog_id = os.getenv('BLOGGER_BLOG_ID')
            api_key = os.getenv('BLOGGER_API_KEY')
            
            logger.info(f"Blog ID: {'SET' if blog_id else 'NOT SET'}")
            logger.info(f"API Key: {'SET' if api_key else 'NOT SET'}")
            
            if not blog_id or not api_key:
                logger.error("❌ Blogger credentials missing!")
                return
            
            # Test basic functionality
            try:
                from googletrans import Translator
                translator = Translator()
                result = translator.translate('こんにちは', dest='mr')
                logger.info(f"✓ Translation test: 'こんにちは' -> '{result.text}'")
                
                # Test Blogger connection
                import requests
                url = f"https://www.googleapis.com/blogger/v3/blogs/{blog_id}"
                params = {'key': api_key}
                response = requests.get(url, params=params)
                
                if response.status_code == 200:
                    blog_name = response.json().get('name', 'Unknown')
                    logger.info(f"✓ Blogger connection successful: {blog_name}")
                    
                    # Create a test post
                    post_data = {
                        'title': 'Manga Translator Test Post',
                        'content': '<p>This is a test post from the manga translator system.</p><p>If you see this, the system is working!</p>',
                        'labels': ['test', 'manga-translator']
                    }
                    
                    post_response = requests.post(
                        f'https://www.googleapis.com/blogger/v3/blogs/{blog_id}/posts',
                        params=params,
                        json=post_data
                    )
                    
                    if post_response.status_code == 200:
                        post_id = post_response.json()['id']
                        logger.info(f"✅ SUCCESS! Test post created: {post_id}")
                        logger.info(f"📝 Post URL: https://www.blogger.com/blog/post/edit/{blog_id}/{post_id}")
                    else:
                        logger.error(f"❌ Failed to create post: {post_response.status_code}")
                        
                else:
                    logger.error(f"❌ Blogger connection failed: {response.status_code}")
                    
            except Exception as e:
                logger.error(f"❌ Error: {e}")
        
        if __name__ == "__main__":
            main()
        EOF
        
    - name: Run fixed translator
      env:
        BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        BLOGGER_API_KEY: ${{ secrets.BLOGGER_API_KEY }}
      run: |
        python fixed_translator.py
